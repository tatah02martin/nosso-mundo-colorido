<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Nosso Mundo Colorido ✨</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at top, #27345F 0%, #11182C 45%, #070912 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .cenario {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px, 90px 90px;
      background-position: 0 0, 25px 35px;
      opacity: 0.25;
      pointer-events: none;
    }

    .palco {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      perspective: 1800px;
    }

    .livro {
      position: relative;
      width: min(85vw, 430px);
      aspect-ratio: 2 / 3;
      transform-style: preserve-3d;
      filter: drop-shadow(0 35px 30px rgba(0, 0, 0, 0.55));
    }

    .capa {
      position: absolute;
      inset: 0;
      border-radius: 0px 18px 18px 0px;
      overflow: hidden;
      transform-origin: left center;
      background: #111;
      cursor: pointer;
      box-shadow:
        inset 0px 15px rgba(0, 0, 0, 0.35),
        inset -3px 0 8px rgba(255, 255, 255, 0.12);
    }

    .capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .livro::before {
      content: "";
      position: absolute;
      top: 12px;
      right: -14px;
      width: 14px;
      height: calc(100% - 24px);
      background: linear-gradient(
        to right,
        #9c927c,
        #f3ead7,
        #cfc2a9
      );
      transform: skewY(-2deg);
      border-radius: 0px 4px 4px 0;
      z-index: -1;
      box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
    }

    .livro::after {
      content: "";
      position: absolute;
      left: -10px;
      top: 4px;
      width: 16px;
      height: calc(100% - 8px);
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.75),
        rgba(255, 255, 255, 0.12),
        rgba(0, 0, 0, 0.45)
      );
      border-radius: 8px 0 0 8px;
      z-index: 2;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .palco {
        padding: 20px;
      }

      .livro {
        width: min(92vw, 390px);
      }
    }
  </style></head><body>  <div class="cenario"></div>  <main class="palco">
    <section class="livro">  <div class="capa" onclick="abrirLivro()">
    <img src="Picsart_26-11-05_22-21-15-115.jpg"
         alt="Capa do livro Nosso Mundo Colorido">
  </div>

</section>

  </main>  <script>
    function abrirLivro() {
      alert("O nosso livro está prestes a se abrir... ✨");
    }
  </script></body>
</html>
