<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nosso Mundo Colorido ✨</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;

      background:
        radial-gradient(
          circle at top,
          #27345F 0%,
          #11182C 45%,
          #070912 100%
        );

      overflow: hidden;
    }


    /* FUNDO ESTRELADO */

    .cenario {
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#b9cfff 1px, transparent 1px);

      background-size:
        50px 50px,
        90px 90px,
        140px 140px;

      background-position:
        0 0,
        25px 35px,
        70px 15px;

      opacity: 0.28;

      pointer-events: none;
    }


    /* PALCO */

    .palco {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 24px;

      perspective: 2200px;
    }


    /* ÁREA 3D */

    .area-3d {
      position: relative;

      width: min(78vw, 460px);

      display: flex;
      justify-content: center;
      align-items: center;

      transform-style: preserve-3d;
    }


    /* LIVRO 3D */

    .livro-3d {
      position: relative;

      width: 100%;

      aspect-ratio: 2 / 3;

      transform-style: preserve-3d;

      transform: rotateY(0deg);

      filter:
        drop-shadow(
          0 35px 30px
          rgba(0, 0, 0, 0.55)
        );

      will-change: transform;
    }


    /* TODAS AS PARTES DO LIVRO */

    .face {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      backface-visibility: hidden;

      transform-style: preserve-3d;
    }


    /* CAPA */

    .capa-3d {
      transform: translateZ(10px);

      border-radius: 0 18px 18px 0;

      overflow: hidden;
    }

    .capa-3d img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      pointer-events: none;
      user-select: none;
    }


    /* CONTRACAPA */

    .contracapa-3d {
      transform:
        rotateY(180deg)
        translateZ(10px);

      border-radius: 18px 0 0 18px;

      overflow: hidden;
    }

    .contracapa-3d img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      pointer-events: none;
      user-select: none;
    }


    /* LOMBADA */

    .lombada-3d {
      position: absolute;

      top: 0;
      left: 0;

      width: 20px;
      height: 100%;

      transform:
        rotateY(-90deg)
        translateZ(10px);

      transform-origin: left center;

      overflow: hidden;

      backface-visibility: visible;
    }

    .lombada-3d img {
      width: 100%;
      height: 100%;

      object-fit: fill;

      display: block;

      pointer-events: none;
      user-select: none;
    }


    /* LATERAL DAS PÁGINAS */

    .paginas-lateral {
      position: absolute;

      top: 8px;
      right: -10px;

      width: 14px;
      height: calc(100% - 16px);

      background:
        linear-gradient(
          to right,
          #9c927c,
          #f3ead7,
          #cfc2a9
        );

      transform:
        rotateY(90deg)
        translateZ(10px);

      border-radius: 2px;

      box-shadow:
        4px 4px 10px
        rgba(0, 0, 0, 0.3);
    }


    /* CONTROLE */

    .controle-area {
      position: relative;

      width: min(70vw, 340px);

      margin-top: 32px;

      display: flex;
      flex-direction: column;

      align-items: center;
    }


    /* TEXTO DISCRETO */

    .controle-texto {
      color: rgba(220, 230, 255, 0.65);

      font-size: 12px;

      letter-spacing: 1px;

      margin-bottom: 12px;

      text-align: center;

      opacity: 0.8;
    }


    /* CONSTELAÇÃO */

    .constelacao {
      position: relative;

      width: 100%;
      height: 42px;

      display: flex;
      align-items: center;

      touch-action: none;

      user-select: none;
    }


    /* LINHA PRINCIPAL */

    .linha {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(180, 205, 255, 0.65),
          rgba(255, 255, 255, 0.85),
          rgba(180, 205, 255, 0.65),
          transparent
        );
    }


    /* PEQUENAS ESTRELAS DA CONSTELAÇÃO */

    .pontinho {
      position: absolute;

      color: rgba(220, 235, 255, 0.75);

      font-size: 10px;

      pointer-events: none;
    }

    .ponto-1 {
      left: 8%;
      top: 8px;
    }

    .ponto-2 {
      left: 25%;
      bottom: 4px;
    }

    .ponto-3 {
      right: 25%;
      top: 4px;
    }

    .ponto-4 {
      right: 8%;
      bottom: 7px;
    }


    /* ESTRELA QUE ARRASTA */

    .estrela-controle {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 38px;
      height: 38px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 25px;

      color: #ffffff;

      cursor: grab;

      text-shadow:
        0 0 8px rgba(180, 210, 255, 0.9),
        0 0 18px rgba(150, 190, 255, 0.7);

      z-index: 3;

      touch-action: none;
    }


    .estrela-controle.arrastando {
      cursor: grabbing;

      transform:
        translate(-50%, -50%)
        scale(1.12);
    }


    /* BRILHO DA ESTRELA */

    .estrela-controle::after {
      content: "";

      position: absolute;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(200, 220, 255, 0.16),
          transparent 65%
        );

      z-index: -1;
    }


    /* ANIMAÇÃO SUAVE QUANDO NÃO ESTÁ ARRASTANDO */

    .livro-3d.suave {
      transition:
        transform 0.8s ease-in-out;
    }


    .estrela-controle.suave {
      transition:
        left 0.25s ease;
    }


    /* CELULAR */

    @media (max-width: 600px) {

      .palco {
        padding:
          20px
          16px
          28px;
      }

      .area-3d {
        width:
          min(76vw, 54vh);
      }

      .controle-area {
        width:
          min(68vw, 300px);

        margin-top: 26px;
      }

    }


    /* TELAS MUITO BAIXAS */

    @media (max-height: 650px) {

      .area-3d {
        width:
          min(66vw, 50vh);
      }

      .controle-area {
        margin-top: 18px;
      }

    }

  </style>

</head>


<body>

  <!-- Fundo -->

  <div class="cenario"></div>


  <!-- Palco -->

  <main class="palco">


    <!-- Área 3D -->

    <div class="area-3d">


      <!-- Livro -->

      <div
        class="livro-3d suave"
        id="livro3d"
      >


        <!-- CAPA -->

        <div class="face capa-3d">

          <img
            src="Capa.livro.png"
            alt="Capa do livro Nosso Mundo Colorido">

        </div>


        <!-- CONTRACAPA -->

        <div class="face contracapa-3d">

          <img
            src="file_00000000a9f0820e8a775aa484273482.png"
            alt="Contracapa do livro">

        </div>


        <!-- LOMBADA -->

        <div class="lombada-3d">

          <img
            src="file_00000000234c820eb65e5bcf2cbd6e66.png"
            alt="Lombada do livro">

        </div>


        <!-- PÁGINAS -->

        <div class="paginas-lateral"></div>


      </div>

    </div>


    <!-- CONTROLE DA CONSTELAÇÃO -->

    <div class="controle-area">

      <div class="controle-texto">
        ARRASTE A ESTRELA PARA EXPLORAR
      </div>


      <div
        class="constelacao"
        id="constelacao"
      >

        <div class="linha"></div>

        <span class="pontinho ponto-1">✦</span>
        <span class="pontinho ponto-2">✧</span>
        <span class="pontinho ponto-3">✦</span>
        <span class="pontinho ponto-4">✧</span>


        <!-- ESTRELA PRINCIPAL -->

        <div
          class="estrela-controle suave"
          id="estrelaControle"
        >
          ✦
        </div>


      </div>

    </div>


  </main>


  <script>

    const livro3d =
      document.getElementById("livro3d");

    const constelacao =
      document.getElementById("constelacao");

    const estrelaControle =
      document.getElementById("estrelaControle");


    let arrastando = false;

    let anguloAtual = 0;


    /* COMEÇA O ARRASTO */

    estrelaControle.addEventListener(
      "pointerdown",
      function (e) {

        arrastando = true;

        estrelaControle.classList.remove("suave");

        livro3d.classList.remove("suave");

        estrelaControle.classList.add("arrastando");

        estrelaControle.setPointerCapture(
          e.pointerId
        );

      }
    );


    /* MOVE A ESTRELA E O LIVRO */

    estrelaControle.addEventListener(
      "pointermove",
      function (e) {

        if (!arrastando) return;


        const rect =
          constelacao.getBoundingClientRect();


        let posicao =
          e.clientX - rect.left;


        /* Limita a estrela à barrinha */

        posicao =
          Math.max(
            0,
            Math.min(
              rect.width,
              posicao
            )
          );


        /* Posição da estrela */

        const porcentagem =
          posicao / rect.width;


        estrelaControle.style.left =
          `${porcentagem * 100}%`;


        /* Giro de 360 graus */

        anguloAtual =
          porcentagem * 360;


        livro3d.style.transform =
          `rotateY(${anguloAtual}deg)`;

      }
    );


    /* TERMINA O ARRASTO */

    function terminarArrasto(e) {

      if (!arrastando) return;

      arrastando = false;


      estrelaControle.classList.remove(
        "arrastando"
      );


      estrelaControle.classList.add(
        "suave"
      );


      livro3d.classList.add(
        "suave"
      );


      /* Libera o toque */

      try {

        estrelaControle.releasePointerCapture(
          e.pointerId
        );

      } catch (erro) {

        /* Nada precisa acontecer aqui */

      }

    }


    estrelaControle.addEventListener(
      "pointerup",
      terminarArrasto
    );


    estrelaControle.addEventListener(
      "pointercancel",
      terminarArrasto
    );


    /* Permite clicar diretamente na linha */

    constelacao.addEventListener(
      "pointerdown",
      function (e) {

        if (
          e.target === estrelaControle
        ) return;


        const rect =
          constelacao.getBoundingClientRect();


        let posicao =
          e.clientX - rect.left;


        posicao =
          Math.max(
            0,
            Math.min(
              rect.width,
              posicao
            )
          );


        const porcentagem =
          posicao / rect.width;


        estrelaControle.style.left =
          `${porcentagem * 100}%`;


        anguloAtual =
          porcentagem * 360;


        livro3d.style.transform =
          `rotateY(${anguloAtual}deg)`;

      }
    );

  </script>

</body>

</html>
