<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nosso Mundo Colorido 🌙✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #2d2b5f 0%, #17152f 45%, #080812 100%);
      color: white;
    }

    .capa {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      overflow: hidden;
      position: relative;
    }

    .estrelas {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 45px 45px, 80px 80px;
      background-position: 0 0, 20px 30px;
      opacity: 0.35;
      pointer-events: none;
    }

    .conteudo {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    }

    .subtitulo {
      font-size: clamp(1rem, 3vw, 1.4rem);
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .botao {
      display: inline-block;
      padding: 16px 30px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.12);
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    .botao:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>

<body>

  <main class="capa">

    <div class="estrelas"></div>

    <div class="conteudo">

      <h1>Nosso Mundo Colorido</h1>

      <p class="subtitulo">
        Uma história escrita entre a lua e as estrelas. 🌙✨
      </p>

      <a href="lua.html" class="botao">
        🌙 Entrar no nosso mundo
      </a>

    </div>

  </main>

</body>
</html>
