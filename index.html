<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nosso Mundo Colorido 🌙✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at top, #27345f 0%, #11162c 45%, #070912 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .cenario {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px, 90px 90px;
      background-position: 0 0, 25px 35px;
      opacity: 0.25;
      pointer-events: none;
    }

    .palco {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      perspective: 1800px;
    }

    .livro {
      position: relative;
      width: min(85vw, 430px);
      aspect-ratio: 2 / 3;
      transform-style: preserve-3d;
      filter: drop-shadow(0 35px 30px rgba(0, 0, 0, 0.55));
    }

    .capa {
      position: absolute;
      inset: 0;
      border-radius: 8px 18px 18px 8px;
      overflow: hidden;
      transform-origin: left center;
      background: #111;
      box-shadow:
        inset 8px 0 15px rgba(0, 0, 0, 0.35),
        inset -3px 0 8px rgba(255, 255, 255, 0.12);
    }

    .capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dá a sensação da lateral e das páginas do livro */
    .livro::before {
      content: "";
      position: absolute;
      top: 12px;
      right: -14px;
      width: 14px;
      height: calc(100% - 24px);
      background: linear-gradient(
        to right,
        #9c927c,
        #f3ead7,
        #cfc2a9
      );
      transform: skewY(-2deg);
      border-radius: 0 4px 4px 0;
      z-index: -1;
      box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
    }

    /* Lombada */
    .livro::after {
      content: "";
      position: absolute;
      left: -10px;
      top: 4px;
      width: 16px;
      height: calc(100% - 8px);
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.75),
        rgba(255, 255, 255, 0.12),
        rgba(0, 0, 0, 0.45)
      );
      border-radius: 8px 0 0 8px;
      z-index: 2;
      pointer-events: none;
    }

    .botao-area {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      z-index: 5;
      width: 90%;
      display: flex;
      justify-content: center;
    }

    .botao {
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(15, 20, 40, 0.55);
      color: white;
      padding: 12px 22px;
      border-radius: 50px;
      font-family: Georgia, serif;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.35),
        0 0 18px rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .botao:hover {
      transform: scale(1.06);
      background: rgba(40, 55, 100, 0.75);
    }

    .botao:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      .palco {
        padding: 20px;
      }

      .livro {
        width: min(92vw, 390px);
      }
    }
  </style>
</head>

<body>

  <div class="cenario"></div>

  <main class="palco">

    <section class="livro">

      <div class="capa">
        <img src="mo.jpg" alt="Capa do livro Nosso Mundo Colorido">

        <div class="botao-area">
          <button class="botao" onclick="abrirLivro()">
            Entrar no nosso mundo ✨
          </button>
        </div>
      </div>

    </section>

  </main>

  <script>
    function abrirLivro() {
      alert("O nosso livro está prestes a se abrir... 🌙✨");
    }
  </script>

</body>
</html>
