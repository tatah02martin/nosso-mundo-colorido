<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Nosso Mundo Colorido ✨</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at top, #27345F 0%, #11182C 45%, #070912 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fundo estrelado */
    .cenario {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px, 90px 90px;
      background-position: 0 0, 25px 35px;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Área onde o livro fica */
    .palco {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      perspective: 1800px;
    }

    /* Livro */
    .livro {
      position: relative;
      width: min(96vw, 520px);
      filter: drop-shadow(0 35px 30px rgba(0, 0, 0, 0.55));
    }

    /* Capa */
    .capa {
      position: relative;
      width: 100%;
      cursor: pointer;
      border-radius: 0 18px 18px 0;
      overflow: hidden;
      background: #111;
      transform-origin: left center;

      box-shadow:
        inset 0px 15px rgba(0, 0, 0, 0.35),
        inset -3px 0 8px rgba(255, 255, 255, 0.12);
    }

    /* Mostra a imagem completa */
    .capa img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Páginas na lateral direita */
    .livro::before {
      content: "";
      position: absolute;
      top: 12px;
      right: -10px;
      width: 12px;
      height: calc(100% - 24px);

      background: linear-gradient(
        to right,
        #9c927c,
        #f3ead7,
        #cfc2a9
      );

      transform: skewY(-2deg);
      border-radius: 0 4px 4px 0;
      z-index: -1;

      box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
    }

    /* Lombada */
    .livro::after {
      content: "";
      position: absolute;
      left: -8px;
      top: 4px;
      width: 14px;
      height: calc(100% - 8px);

      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.75),
        rgba(255, 255, 255, 0.12),
        rgba(0, 0, 0, 0.45)
      );

      border-radius: 8px 0 0 8px;
      z-index: 2;
      pointer-events: none;
    }

    /* Ajustes exclusivos para celular */
    @media (max-width: 600px) {

      .palco {
        padding: 16px;
      }

      .livro {
        width: min(92vw, 62vh);
      }

    }
  </style></head><body>  <div class="cenario"></div>  <main class="palco"><section class="livro">

  <div class="capa">

    <img
      src="Capa livro♡.png"
      alt="Capa do livro Nosso Mundo Colorido">

  </div>

</section>

  </main></body>
</html>
