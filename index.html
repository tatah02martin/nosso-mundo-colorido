<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nosso Mundo Colorido ✨</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      min-height: 100vh;

      font-family: Georgia, serif;

      background:
        radial-gradient(
          circle at top,
          #27345F 0%,
          #11182C 45%,
          #070912 100%
        );

      overflow: hidden;
    }


    /* =========================
       FUNDO ESTRELADO
       ========================= */

    .cenario {
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#b9cfff 1px, transparent 1px);

      background-size:
        50px 50px,
        90px 90px,
        140px 140px;

      background-position:
        0 0,
        25px 35px,
        70px 15px;

      opacity: 0.28;

      pointer-events: none;
    }


    /* =========================
       PALCO
       ========================= */

    .palco {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 20px;

      perspective: 1800px;
    }


    /* =========================
       ÁREA DO LIVRO
       ========================= */

    .area-livro {
      position: relative;

      width: min(76vw, 54vh);
      aspect-ratio: 2 / 3;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       LIVRO 3D
       ========================= */

    .livro-3d {

      /* Espessura visual */

      --profundidade: 32px;

      position: relative;

      width: 100%;
      height: 100%;

      transform-style: preserve-3d;

      transform: rotateY(0deg);

      will-change: transform;

      filter:
        drop-shadow(
          0 30px 28px
          rgba(0, 0, 0, 0.55)
        );
    }


    /* =========================
       CAPA E CONTRACAPA
       ========================= */

    .frente,
    .tras {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      backface-visibility: hidden;
    }


    .frente img,
    .tras img {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: fill;

      pointer-events: none;
      user-select: none;
    }


    /* CAPA */

    .frente {

      transform:
        translateZ(
          calc(var(--profundidade) / 2)
        );

      border-radius:
        0 14px 14px 0;
    }


    /* CONTRACAPA */

    .tras {

      transform:
        rotateY(180deg)
        translateZ(
          calc(var(--profundidade) / 2)
        );

      border-radius:
        14px 0 0 14px;
    }


    /* =========================
       LOMBADA
       ========================= */

    .lombada {

      position: absolute;

      top: 0;
      left: 50%;

      width:
        var(--profundidade);

      height: 100%;

      margin-left:
        calc(var(--profundidade) / -2);

      overflow: hidden;

      backface-visibility: visible;

      transform:
        rotateY(-90deg)
        translateZ(var(--meia-largura));
    }


    .lombada img {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: fill;

      pointer-events: none;
      user-select: none;
    }


    /* =========================
       LATERAL DAS PÁGINAS
       ========================= */

    .paginas {

      position: absolute;

      top: 6px;
      left: 50%;

      width:
        var(--profundidade);

      height:
        calc(100% - 12px);

      margin-left:
        calc(var(--profundidade) / -2);

      background:

        repeating-linear-gradient(
          to bottom,

          #eee5d2 0px,
          #eee5d2 2px,

          #cfc3ab 3px,

          #f7f0df 4px
        );


      box-shadow:

        inset 2px 0 4px
        rgba(0, 0, 0, 0.22),

        inset -2px 0 3px
        rgba(255, 255, 255, 0.35);


      transform:
        rotateY(90deg)
        translateZ(var(--meia-largura));
    }


    /* =========================
       CONTROLE
       ========================= */

    .controle-area {

      width:
        min(68vw, 300px);

      margin-top: 28px;

      display: flex;
      flex-direction: column;

      align-items: center;
    }


    .controle-texto {

      color:
        rgba(220, 230, 255, 0.6);

      font-size: 10px;

      letter-spacing: 1.2px;

      margin-bottom: 10px;

      text-align: center;
    }


    /* =========================
       CONSTELAÇÃO
       ========================= */

    .constelacao {

      position: relative;

      width: 100%;
      height: 44px;

      touch-action: none;

      user-select: none;
    }


    .linha {

      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 1px;

      background:

        linear-gradient(
          90deg,

          transparent,

          rgba(180, 205, 255, 0.65),

          rgba(255, 255, 255, 0.9),

          rgba(180, 205, 255, 0.65),

          transparent
        );
    }


    /* Estrelas pequenas */

    .pontinho {

      position: absolute;

      color:
        rgba(220, 235, 255, 0.75);

      font-size: 10px;

      pointer-events: none;
    }


    .ponto-1 {
      left: 8%;
      top: 6px;
    }


    .ponto-2 {
      left: 25%;
      bottom: 4px;
    }


    .ponto-3 {
      right: 25%;
      top: 4px;
    }


    .ponto-4 {
      right: 8%;
      bottom: 6px;
    }


    /* =========================
       ESTRELA ARRASTÁVEL
       ========================= */

    .estrela-controle {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 42px;
      height: 42px;

      display: flex;

      justify-content: center;
      align-items: center;

      transform:
        translate(-50%, -50%);

      font-size: 26px;

      color: white;

      cursor: grab;

      z-index: 10;

      touch-action: none;

      text-shadow:

        0 0 8px
        rgba(180, 210, 255, 0.9),

        0 0 18px
        rgba(150, 190, 255, 0.7);
    }


    .estrela-controle.arrastando {

      cursor: grabbing;

      transform:
        translate(-50%, -50%)
        scale(1.12);
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      .palco {

        padding:
          18px
          16px
          24px;
      }


      .area-livro {

        width:
          min(76vw, 54vh);
      }


      .controle-area {

        width:
          min(68vw, 300px);

        margin-top: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- FUNDO -->

  <div class="cenario"></div>


  <!-- PALCO -->

  <main class="palco">


    <!-- ÁREA DO LIVRO -->

    <div class="area-livro">


      <!-- LIVRO 3D -->

      <div
        class="livro-3d"
        id="livro3d"
      >


        <!-- =====================
             CAPA
             ===================== -->

        <div class="frente">

          <img
            src="Capa.livro.png"
            alt="Capa do livro Nosso Mundo Colorido"
          >

        </div>



        <!-- =====================
             CONTRACAPA
             ===================== -->

        <div class="tras">

          <img
            src="file_00000000a9f0820e8a775aa484273482.png"
            alt="Contracapa do livro"
          >

        </div>



        <!-- =====================
             LOMBADA
             ===================== -->

        <div class="lombada">

          <img
            src="file_00000000234c820eb65e5bcf2cbd6e66.png"
            alt="Lombada do livro"
          >

        </div>



        <!-- =====================
             PÁGINAS
             ===================== -->

        <div class="paginas"></div>


      </div>


    </div>



    <!-- =====================
         CONTROLE
         ===================== -->

    <div class="controle-area">


      <div class="controle-texto">

        ARRASTE A ESTRELA PARA EXPLORAR

      </div>



      <div
        class="constelacao"
        id="constelacao"
      >


        <div class="linha"></div>


        <span class="pontinho ponto-1">✦</span>

        <span class="pontinho ponto-2">✧</span>

        <span class="pontinho ponto-3">✦</span>

        <span class="pontinho ponto-4">✧</span>



        <!-- ESTRELA -->

        <div
          class="estrela-controle"
          id="estrelaControle"
        >

          ✦

        </div>


      </div>


    </div>


  </main>



  <script>


    const livro3d =
      document.getElementById("livro3d");


    const constelacao =
      document.getElementById("constelacao");


    const estrelaControle =
      document.getElementById("estrelaControle");


    let arrastando = false;



    /* =========================
       CALCULA A LARGURA
       ========================= */

    function atualizarLivro() {


      const largura =
        livro3d.offsetWidth;


      livro3d.style.setProperty(

        "--meia-largura",

        `${largura / 2}px`

      );

    }


    atualizarLivro();


    window.addEventListener(
      "resize",
      atualizarLivro
    );



    /* =========================
       COMEÇA A ARRASTAR
       ========================= */

    estrelaControle.addEventListener(

      "pointerdown",

      function (e) {


        arrastando = true;


        estrelaControle.classList.add(
          "arrastando"
        );


        estrelaControle.setPointerCapture(
          e.pointerId
        );


      }

    );



    /* =========================
       MOVIMENTO
       ========================= */

    estrelaControle.addEventListener(

      "pointermove",

      function (e) {


        if (!arrastando) return;


        const rect =
          constelacao.getBoundingClientRect();


        let x =
          e.clientX - rect.left;


        /* Não deixa sair da linha */

        x =
          Math.max(

            0,

            Math.min(
              rect.width,
              x
            )

          );


        const porcentagem =
          x / rect.width;


        /* Move a estrela */

        estrelaControle.style.left =
          `${porcentagem * 100}%`;


        /* =====================
           GIRA O LIVRO
           ===================== */

        const angulo =
          porcentagem * 360;


        livro3d.style.transform =
          `rotateY(${angulo}deg)`;


      }

    );



    /* =========================
       TERMINA O ARRASTO
       ========================= */

    function terminarArrasto(e) {


      if (!arrastando) return;


      arrastando = false;


      estrelaControle.classList.remove(
        "arrastando"
      );


      try {

        estrelaControle.releasePointerCapture(
          e.pointerId
        );

      } catch (erro) {}


    }



    estrelaControle.addEventListener(
      "pointerup",
      terminarArrasto
    );


    estrelaControle.addEventListener(
      "pointercancel",
      terminarArrasto
    );


  </script>


</body>

</html>
