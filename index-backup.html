<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nosso Mundo Colorido ✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at top, #27345F 0%, #11182C 45%, #070912 100%);
      overflow: hidden;
    }

    .cenario {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px, 90px 90px;
      background-position: 0 0, 25px 35px;
      opacity: 0.25;
      pointer-events: none;
    }

    .palco {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1800px;
    }

    .livro-area {
  position: relative;
  width: clamp(240px, 27vw, 360px);
  aspect-ratio: 2 / 3;
  perspective: 1800px;
  display: flex;
  justify-content: center;
  align-items: center;
}

    .livro {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  filter: none;
  box-shadow: 0 18px 28px rgba(0, 0, 0, 0.28);
}

    .pagina-interna {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #f8f2e7, #e9ddca);
      border-radius: 4px 16px 16px 4px;
      box-shadow:
        inset 10px 0 18px rgba(0, 0, 0, 0.12),
        0 8px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .pagina-interna::before {
      content: "✨";
      font-size: 42px;
      opacity: 0.55;
    }

    .capa {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      z-index: 2;
    }

    .capa.arrastando {
      cursor: grabbing;
    }

    .capa-frente,
    .capa-verso {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .capa-frente {
      overflow: hidden;
      border-radius: 0 18px 18px 0;
      background: #111;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .capa-frente img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .capa-verso {
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: linear-gradient(135deg, #f8f2e7, #e9ddca);
      border-radius: 18px 0 0 18px;
      box-shadow: inset 8px 0 15px rgba(0, 0, 0, 0.12);
    }

    .lombada {
      position: absolute;
      left: -7px;
      top: 4px;
      width: 14px;
      height: calc(100% - 8px);
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.7),
        rgba(255, 255, 255, 0.14),
        rgba(0, 0, 0, 0.45)
      );
      border-radius: 8px 0 0 8px;
      z-index: 5;
      pointer-events: none;
    }

    .paginas-lateral {
      position: absolute;
      top: 12px;
      right: -10px;
      width: 12px;
      height: calc(100% - 24px);
      background: linear-gradient(
        to right,
        #9c927c,
        #f3ead7,
        #cfc2a9
      );
      transform: skewY(-2deg);
      border-radius: 0 4px 4px 0;
      z-index: -1;
      box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
      .palco {
        padding: 20px;
      }

      .livro-area {
        width: min(76vw, 52vh);
      }
    }
  </style>
</head>

<body>

  <div class="cenario"></div>

  <main class="palco">
    <section class="livro-area">

      <div class="livro" id="livro">

        <div class="pagina-interna"></div>

        <div class="paginas-lateral"></div>

        <div class="lombada"></div>

        <div class="capa" id="capa">

          <div class="capa-frente">
            <img
              src="Capa.livro.png"
              alt="Capa do livro Nosso Mundo Colorido"
              draggable="false"
            >
          </div>

          <div class="capa-verso"></div>

        </div>

      </div>
    </section>
  </main>

  
<script>
  const capa = document.getElementById("capa");

  let arrastando = false;
  let anguloAtual = 0;
  let inicioX = 0;
  let anguloInicio = 0;
  let ponteiroAtivo = null;

  let movimentoPendente = null;
  let quadroAgendado = false;

  function limitar(valor, minimo, maximo) {
    return Math.max(minimo, Math.min(maximo, valor));
  }

  function aplicarRotacao(angulo) {
    anguloAtual = angulo;
    capa.style.transform = `rotate3d(0, 1, 0, ${angulo}deg)`;
  }

  function atualizarMovimento() {
    quadroAgendado = false;

    if (!arrastando || movimentoPendente === null) return;

    const largura = capa.getBoundingClientRect().width;
    const movimento = movimentoPendente - inicioX;

    const variacao = (movimento / largura) * 180;

    const novoAngulo = limitar(
      anguloInicio + variacao,
      -180,
      0
    );

    aplicarRotacao(novoAngulo);
    movimentoPendente = null;
  }

  capa.addEventListener("pointerdown", function(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;

    e.preventDefault();

    arrastando = true;
    ponteiroAtivo = e.pointerId;

    inicioX = e.clientX;
    anguloInicio = anguloAtual;

    movimentoPendente = null;

    capa.style.transition = "none";
    capa.classList.add("arrastando");

    try {
      capa.setPointerCapture(e.pointerId);
    } catch (erro) {}
  });

  window.addEventListener("pointermove", function(e) {
    if (!arrastando || e.pointerId !== ponteiroAtivo) return;

    e.preventDefault();

    movimentoPendente = e.clientX;

    if (!quadroAgendado) {
      quadroAgendado = true;
      requestAnimationFrame(atualizarMovimento);
    }
  }, { passive: false });

  function terminarArrasto(e) {
    if (!arrastando || e.pointerId !== ponteiroAtivo) return;

    // Aplica o último movimento antes de decidir o destino.
    if (movimentoPendente !== null) {
      atualizarMovimento();
    }

    arrastando = false;
    ponteiroAtivo = null;
    movimentoPendente = null;

    capa.classList.remove("arrastando");

    const destino = anguloAtual < -90 ? -180 : 0;

    capa.style.transition =
      "transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)";

    aplicarRotacao(destino);
  }

  window.addEventListener("pointerup", terminarArrasto);
  window.addEventListener("pointercancel", terminarArrasto);
</script>

</body>
</html>
